# PowerSync Sync Streams configuration for FamousGate.
# Uses config edition 3 (Sync Streams). Deploy with:
#   powersync deploy sync-config --directory backend/powersync

config:
  edition: 3

streams:
  # Global reference data
  branches:
    auto_subscribe: true
    priority: 1
    query: SELECT * FROM branches WHERE is_active = true

  # User profile and notifications
  users:
    auto_subscribe: true
    priority: 1
    query: SELECT * FROM users WHERE id = auth.user_id()

  notifications:
    auto_subscribe: true
    priority: 2
    query: SELECT * FROM notifications WHERE user_id = auth.user_id()

  # Branch-wide data via user join (avoids auth.jwt() for broader compatibility)
  branch_data:
    auto_subscribe: true
    priority: 2
    queries:
      - |
        SELECT po.* FROM pos_outlets po
        INNER JOIN users u ON u.branch_id = po.branch_id
        WHERE u.id = auth.user_id() AND po.is_active = true
      - |
        SELECT a.* FROM pos_outlet_assignments a
        INNER JOIN users u ON u.branch_id = a.branch_id
        WHERE u.id = auth.user_id()
      - |
        SELECT i.* FROM pos_outlet_items i
        INNER JOIN users u ON u.branch_id = i.branch_id
        WHERE u.id = auth.user_id() AND i.is_active = true
      - |
        SELECT s.* FROM branch_stock s
        INNER JOIN users u ON u.branch_id = s.branch_id
        WHERE u.id = auth.user_id()
      - |
        SELECT m.* FROM branch_stock_movements m
        INNER JOIN users u ON u.branch_id = m.branch_id
        WHERE u.id = auth.user_id()
      - |
        SELECT b.* FROM staff_credit_bills b
        INNER JOIN users u ON u.branch_id = b.branch_id
        WHERE u.id = auth.user_id()

  # POS outlet data via active_outlet_id join
  outlet_data:
    auto_subscribe: true
    priority: 3
    queries:
      - |
        SELECT s.* FROM pos_outlet_shifts s
        INNER JOIN users u ON u.active_outlet_id = s.outlet_id
        WHERE u.id = auth.user_id()
      - |
        SELECT o.* FROM pos_shift_orders o
        INNER JOIN users u ON u.active_outlet_id = o.outlet_id
        WHERE u.id = auth.user_id()
      - |
        SELECT p.* FROM pos_shift_payments p
        INNER JOIN pos_outlet_shifts s ON s.id = p.shift_id
        INNER JOIN users u ON u.active_outlet_id = s.outlet_id
        WHERE u.id = auth.user_id()
      - |
        SELECT c.* FROM pos_shift_stock_counts c
        INNER JOIN pos_outlet_shifts s ON s.id = c.shift_id
        INNER JOIN users u ON u.active_outlet_id = s.outlet_id
        WHERE u.id = auth.user_id()
      - |
        SELECT v.* FROM pos_void_requests v
        INNER JOIN users u ON u.active_outlet_id = v.outlet_id
        WHERE u.id = auth.user_id()
      - |
        SELECT iv.* FROM pos_item_void_requests iv
        INNER JOIN pos_outlet_shifts s ON s.id = iv.shift_id
        INNER JOIN users u ON u.active_outlet_id = s.outlet_id
        WHERE u.id = auth.user_id()
      - |
        SELECT e.* FROM pos_item_exchange_requests e
        INNER JOIN users u ON u.active_outlet_id = e.outlet_id
        WHERE u.id = auth.user_id()
