# PowerSync sync rules for FamousGate Flutter app.
# These rules define which rows from the PostgreSQL backend are synced to
# each device bucket, based on the JWT claims issued by /powersync/credentials.
#
# Available JWT claims / token parameters:
#   - user_id   (subject claim)
#   - role
#   - branch_id
#   - active_outlet_id
#   - active_outlet_type
#   - active_outlet_prefix
#   - is_pos_login

bucket_definitions:
  # ---------------------------------------------------------------------------
  # Global: data every device needs regardless of user/branch.
  # ---------------------------------------------------------------------------
  global:
    data:
      - SELECT * FROM branches WHERE is_active = true

  # ---------------------------------------------------------------------------
  # User: data tied to the authenticated user.
  # ---------------------------------------------------------------------------
  user:
    parameters:
      - SELECT request.user_id() AS user_id
    data:
      - SELECT * FROM users WHERE id = bucket.user_id
      - SELECT * FROM notifications WHERE user_id = bucket.user_id

  # ---------------------------------------------------------------------------
  # Branch: all data for the user's branch. Used by branch managers,
  # storekeepers, accountants, and cashiers that need branch-wide context.
  # ---------------------------------------------------------------------------
  branch:
    parameters:
      - SELECT request.jwt()->>'branch_id' AS branch_id
    data:
      - SELECT * FROM pos_outlets WHERE branch_id = bucket.branch_id AND is_active = true
      - SELECT * FROM pos_outlet_assignments WHERE branch_id = bucket.branch_id
      - SELECT * FROM pos_outlet_items WHERE branch_id = bucket.branch_id AND is_active = true
      - SELECT * FROM branch_stock WHERE branch_id = bucket.branch_id
      - SELECT * FROM branch_stock_movements WHERE branch_id = bucket.branch_id
      - SELECT * FROM staff_credit_bills WHERE branch_id = bucket.branch_id

  # ---------------------------------------------------------------------------
  # Outlet: POS-only data for the cashier's active outlet.
  # If the device has no active_outlet_id, this bucket is empty.
  # ---------------------------------------------------------------------------
  outlet:
    parameters:
      - SELECT request.jwt()->>'active_outlet_id' AS outlet_id
    data:
      - SELECT * FROM pos_outlet_shifts WHERE outlet_id = bucket.outlet_id
      - SELECT * FROM pos_shift_orders WHERE outlet_id = bucket.outlet_id
      - SELECT * FROM pos_shift_payments WHERE shift_id IN (
          SELECT id FROM pos_outlet_shifts WHERE outlet_id = bucket.outlet_id
        )
      - SELECT * FROM pos_shift_stock_counts WHERE shift_id IN (
          SELECT id FROM pos_outlet_shifts WHERE outlet_id = bucket.outlet_id
        )
      - SELECT * FROM pos_void_requests WHERE outlet_id = bucket.outlet_id
      - SELECT * FROM pos_item_void_requests WHERE shift_id IN (
          SELECT id FROM pos_outlet_shifts WHERE outlet_id = bucket.outlet_id
        )
      - SELECT * FROM pos_item_exchange_requests WHERE outlet_id = bucket.outlet_id
