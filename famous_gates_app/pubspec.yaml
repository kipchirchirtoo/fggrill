name: famous_gates_app
description: "Famous Gates Hotels Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Auth & Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0

  # UI
  phosphor_flutter: ^2.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  audioplayers: ^6.1.0

  # Printing
  printing: ^5.13.1
  pdf: ^3.11.0
  esc_pos_utils_plus: ^2.0.2

  # Utils
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dependency_overrides:
  phosphor_flutter:
    path: packages/phosphor_flutter_compat

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/frontend_public/
    - assets/frontend_public/fggallery/
    - assets/sounds/
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/sf_pro_display/SFPRODISPLAYREGULAR.OTF
        - asset: assets/fonts/sf_pro_display/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/fonts/sf_pro_display/SFPRODISPLAYBOLD.OTF
          weight: 700
