[package]
name = "famous-gates-desktop"
version = "1.0.0"
description = "Famous Gates Hotels — Hybrid Desktop Application"
authors = ["Hirall Systems <info@hirall.com>"]
license = "MIT"
repository = "https://github.com/hirall/famous-gates-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "famous_gates_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "famous-gates-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
keyring = "2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
