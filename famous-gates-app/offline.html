<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famous Gates Hotels — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 24px;
    }
    .logo { font-size: 48px; }
    h1 { font-size: 28px; font-weight: 700; color: #fbbf24; }
    p { color: #94a3b8; font-size: 16px; text-align: center; max-width: 400px; line-height: 1.6; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status { display: flex; align-items: center; font-size: 14px; color: #64748b; }
    button {
      background: #fbbf24; color: #0f172a; border: none;
      padding: 12px 32px; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    button:hover { background: #f59e0b; }
  </style>
</head>
<body>
  <div class="logo">🏨</div>
  <h1>Famous Gates Hotels</h1>
  <div class="status"><span class="dot"></span> No internet connection</div>
  <p>The app requires an internet connection to load. Please check your network and try again.</p>
  <button onclick="location.reload()">Retry Connection</button>
</body>
</html>
