name: Flutter Desktop Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux bundle
        working-directory: famous_gates_app
        run: |
          flutter config --enable-linux-desktop
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION:-1.0.0}"
          BUILD_NUMBER="${{ github.run_number }}"
          perl -0pi -e "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/m" pubspec.yaml
          flutter pub get
          flutter build linux --release
          PACKAGE_ROOT="dist/linux/famous-gates_${VERSION}_amd64"
          mkdir -p "${PACKAGE_ROOT}/DEBIAN"
          mkdir -p "${PACKAGE_ROOT}/opt/famous-gates"
          mkdir -p "${PACKAGE_ROOT}/usr/bin"
          mkdir -p "${PACKAGE_ROOT}/usr/share/applications"
          mkdir -p "${PACKAGE_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp -a build/linux/x64/release/bundle/. "${PACKAGE_ROOT}/opt/famous-gates/"
          cp assets/frontend_public/fglogo.png "${PACKAGE_ROOT}/usr/share/icons/hicolor/256x256/apps/famous-gates.png"
          ln -s /opt/famous-gates/famous_gates_app "${PACKAGE_ROOT}/usr/bin/famous-gates"

          cat > "${PACKAGE_ROOT}/DEBIAN/control" <<EOF
          Package: famous-gates
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Famous Gates Hotels <support@famousgates.com>
          Depends: libgtk-3-0, libstdc++6, libsqlite3-0, libsecret-1-0, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0
          Description: Famous Gates Hotels Management System
           Desktop client for the Famous Gates hotel management platform.
          EOF

          cat > "${PACKAGE_ROOT}/usr/share/applications/famous-gates.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Famous Gates
          Comment=Famous Gates Hotels Management System
          Exec=/opt/famous-gates/famous_gates_app
          Path=/opt/famous-gates
          Icon=famous-gates
          Terminal=false
          Categories=Office;Finance;
          EOF

          chmod 755 "${PACKAGE_ROOT}/opt/famous-gates/famous_gates_app"
          dpkg-deb --build --root-owner-group "${PACKAGE_ROOT}" "dist/FamousGates-${VERSION}-linux-x64.deb"
          tar -czf "dist/FamousGates-${VERSION}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: famous-gates-linux-x64
          path: |
            famous_gates_app/dist/FamousGates-*-linux-x64.deb
            famous_gates_app/dist/FamousGates-*-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows release
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows bundle
        working-directory: famous_gates_app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.0" }
          $buildNumber = "${{ github.run_number }}"
          (Get-Content pubspec.yaml) -replace '^version: .+$', "version: $version+$buildNumber" | Set-Content pubspec.yaml
          flutter pub get
          flutter build windows --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\FamousGates-$version-windows-x64-portable.zip" -Force
          $stage = "C:\fg-release"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination $stage -Recurse -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DMyAppSource=C:\fg-release" `
            "/DMyAppOutput=${env:GITHUB_WORKSPACE}\famous_gates_app\dist" `
            "${env:GITHUB_WORKSPACE}\.github\installers\famous-gates-windows.iss"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: famous-gates-windows-x64
          path: |
            famous_gates_app/dist/FamousGates-Setup-*-x64.exe
            famous_gates_app/dist/FamousGates-*-windows-x64-portable.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK
        working-directory: famous_gates_app
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION:-1.0.0}"
          BUILD_NUMBER="${{ github.run_number }}"
          perl -0pi -e "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/m" pubspec.yaml
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/FamousGates-${VERSION}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: famous-gates-android
          path: famous_gates_app/dist/FamousGates-*-android.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows
      - build-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release upload "${TAG}" \
            release-artifacts/famous-gates-linux-x64/FamousGates-*-linux-x64.deb \
            release-artifacts/famous-gates-linux-x64/FamousGates-*-linux-x64.tar.gz \
            release-artifacts/famous-gates-windows-x64/FamousGates-Setup-*-x64.exe \
            release-artifacts/famous-gates-windows-x64/FamousGates-*-windows-x64-portable.zip \
            release-artifacts/famous-gates-android/FamousGates-*-android.apk \
            --clobber
