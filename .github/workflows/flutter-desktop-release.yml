name: Flutter Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update, for example v2.0.6"
        required: true
        default: "v2.0.6"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux bundle
        working-directory: famous_gates_app
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
          tar -czf famous-gates-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: famous-gates-linux-x64
          path: famous_gates_app/famous-gates-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows release
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows bundle
        working-directory: famous_gates_app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath famous-gates-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: famous-gates-windows-x64
          path: famous_gates_app/famous-gates-windows-x64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          NOTES="Famous Gates Flutter desktop release.

Included builds:
- Linux x64
- Windows x64"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              release-artifacts/famous-gates-linux-x64/famous-gates-linux-x64.tar.gz \
              release-artifacts/famous-gates-windows-x64/famous-gates-windows-x64.zip \
              --clobber
          else
            gh release create "${TAG}" \
              release-artifacts/famous-gates-linux-x64/famous-gates-linux-x64.tar.gz \
              release-artifacts/famous-gates-windows-x64/famous-gates-windows-x64.zip \
              --title "Famous Gates Desktop ${TAG}" \
              --notes "${NOTES}"
          fi
