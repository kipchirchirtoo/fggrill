name: Build and Release Electron App

on:
  push:
    branches:
      - main  # Adjust this to your main branch name
  workflow_dispatch: # Allow manual triggers

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # Required to create releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Build Backend
        run: |
          cd backend
          npm install
          npm run build
          cd ..

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Build and Publish Electron (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_HTTP_REQUEST_RETRIES: 5
          ELECTRON_BUILDER_HTTP_REQUEST_RETRY_MILLISECONDS: 60000
        run: npx electron-builder build --win --publish always

      - name: Build and Publish Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_HTTP_REQUEST_RETRIES: 5
          ELECTRON_BUILDER_HTTP_REQUEST_RETRY_MILLISECONDS: 60000
        run: npx electron-builder build --linux --publish always