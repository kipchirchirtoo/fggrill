name: Schema Audit

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  schema-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary

      - name: Extract live schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 backend/scripts/extract-live-schema.py

      - name: Regenerate types
        run: |
          python3 backend/scripts/generate-types.py

      - name: Check type drift
        run: |
          if ! git diff --quiet backend/src/types/database.types.ts; then
            echo "ERROR: database.types.ts has drifted from live schema"
            echo "Run: python3 backend/scripts/generate-types.py"
            exit 1
          fi

      - name: Run API schema audit
        run: |
          python3 backend/scripts/api-schema-audit.py

      - name: Check for new CRITICAL issues
        run: |
          CRITICAL_COUNT=$(python3 -c "import json; print(json.load(open('API_SCHEMA_AUDIT_REPORT.json'))['summary']['bySeverity'].get('CRITICAL', 0))")
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "ERROR: $CRITICAL_COUNT CRITICAL schema issues found"
            exit 1
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: schema-audit-report
          path: API_SCHEMA_AUDIT_REPORT.json
          retention-days: 30
