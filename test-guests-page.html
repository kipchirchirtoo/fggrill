<!DOCTYPE html>
<html>
<head>
    <title>Test Guests Page</title>
    <script>
        async function testGuestsPage() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing guests page...</p>';
            
            try {
                // Test if page loads
                const response = await fetch('http://localhost:3001/dashboard/reception/guests');
                results.innerHTML += `<p>✓ Page loads: ${response.ok ? 'YES' : 'NO'} (${response.status})</p>`;
                
                // Test guests API
                const guestsResponse = await fetch('http://localhost:3000/api/guests', {
                    headers: {
                        'Authorization': 'Bearer YOUR_TOKEN_HERE'
                    }
                });
                const guestsData = await guestsResponse.json();
                results.innerHTML += `<p>✓ Guests API: ${guestsResponse.ok ? 'YES' : 'NO'}</p>`;
                results.innerHTML += `<p>Total guests: ${guestsData.data?.length || 0}</p>`;
                
                // Test bookings API
                const bookingsResponse = await fetch('http://localhost:3000/api/bookings', {
                    headers: {
                        'Authorization': 'Bearer YOUR_TOKEN_HERE'
                    }
                });
                const bookingsData = await bookingsResponse.json();
                const checkedIn = (bookingsData.data || []).filter(b => 
                    b.status === 'checked_in' || b.status === 'checked-in'
                );
                results.innerHTML += `<p>✓ Bookings API: ${bookingsResponse.ok ? 'YES' : 'NO'}</p>`;
                results.innerHTML += `<p>Checked-in guests: ${checkedIn.length}</p>`;
                
                results.innerHTML += '<hr><h3>Summary:</h3>';
                results.innerHTML += `<p>Total Guests: ${guestsData.data?.length || 0}</p>`;
                results.innerHTML += `<p>Checked In: ${checkedIn.length}</p>`;
                results.innerHTML += `<p>VIP Guests: ${(guestsData.data || []).filter(g => g.isVip || g.vip_status).length}</p>`;
                
            } catch (error) {
                results.innerHTML += `<p style="color: red;">✗ Error: ${error.message}</p>`;
            }
        }
    </script>
</head>
<body>
    <h1>Guests Page Test</h1>
    <button onclick="testGuestsPage()">Run Test</button>
    <div id="results"></div>
    
    <hr>
    <h2>Instructions:</h2>
    <ol>
        <li>Make sure backend is running on port 3000</li>
        <li>Make sure frontend is running on port 3001</li>
        <li>Open browser console and get your auth token</li>
        <li>Replace 'YOUR_TOKEN_HERE' in the script with your actual token</li>
        <li>Click "Run Test" button</li>
    </ol>
</body>
</html>
