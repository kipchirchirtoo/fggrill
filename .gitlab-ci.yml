# Trigger: $(date)
stages:
  - build
  - package
  - release

variables:
  NODE_VERSION: "18"
  RUST_VERSION: "1.75"
  # Required for Tauri desktop app compilation (runtime config)
  SUPABASE_URL: "https://placeholder.supabase.co"
  SUPABASE_ANON_KEY: "placeholder-key"

# ==================== TAURI BUILD (LINUX) ====================
build-tauri-linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y 
        curl wget 
        libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        build-essential cmake pkg-config libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
        libssl-dev
    - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
    - apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
    - rustup target add x86_64-unknown-linux-gnu
  script:
    - cd famous-gates-desktop/apps/desktop
    - npm ci
    - SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" npm run tauri build -- --target x86_64-unknown-linux-gnu
  artifacts:
    name: "tauri-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - famous-gates-desktop/apps/desktop/src-tauri/target/release/bundle/deb/*.deb
      - famous-gates-desktop/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 30 days
  only:
    - main
    - tags

# ==================== TAURI BUILD (WINDOWS) ====================
# Cross-compile from Linux to Windows using MinGW
build-tauri-windows:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y 
        curl wget mingw-w64 nsis 
        libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        build-essential cmake pkg-config libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
        libssl-dev
    - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
    - apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cd famous-gates-desktop/apps/desktop
    - npm ci
    - SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" npm run tauri build -- --target x86_64-pc-windows-gnu
  artifacts:
    name: "tauri-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - famous-gates-desktop/apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
      - famous-gates-desktop/apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
    expire_in: 30 days
  only:
    - main
    - tags

# ==================== ELECTRON BUILD (LINUX) ====================
build-electron-linux:
  stage: build
  image: electronuserland/builder:latest
  before_script:
    - apt-get update && apt-get install -y rpm dpkg fakeroot libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 || true
  script:
    - cd electron
    - npm ci
    - npm run dist -- --linux --publish never
  artifacts:
    name: "electron-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - electron/dist/*.AppImage
      - electron/dist/*.deb
      - electron/dist/*.rpm
    expire_in: 30 days
  only:
    - main
    - tags

# ==================== ELECTRON BUILD (WINDOWS) ====================
build-electron-windows:
  stage: build
  image: electronuserland/builder:wine
  script:
    - cd electron
    - npm ci
    - npm run dist -- --win --publish never
  artifacts:
    name: "electron-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - electron/dist/*.exe
      - electron/dist/*.msi
    expire_in: 30 days
  only:
    - main
    - tags

# ==================== CREATE RELEASE ====================
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release..."
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Automated build of Tauri and Electron apps"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Tauri Linux (.deb)"
          url: "${CI_JOB_URL}/artifacts/download?file_type=archive"
        - name: "Tauri Linux (.AppImage)"
          url: "${CI_JOB_URL}/artifacts/download?file_type=archive"
        - name: "Electron Linux (.AppImage)"
          url: "${CI_JOB_URL}/artifacts/download?file_type=archive"
  dependencies:
    - build-tauri-linux
    - build-electron-linux
  only:
    - tags
  when: manual

# ==================== PAGES (Download Site) ====================
pages:
  stage: release
  image: alpine:latest
  script:
    - mkdir -p public/downloads
    - cp famous-gates-desktop/apps/desktop/src-tauri/target/release/bundle/deb/*.deb public/downloads/ 2>/dev/null || true
    - cp famous-gates-desktop/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage public/downloads/ 2>/dev/null || true
    - cp electron/dist/*.AppImage public/downloads/ 2>/dev/null || true
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head><title>FamousGates Desktop Downloads</title></head>
      <body>
        <h1>FamousGates Desktop App Downloads</h1>
        <h2>Latest Build</h2>
        <ul>
          <li><a href="downloads/">Tauri Linux (.deb)</a></li>
          <li><a href="downloads/">Tauri Linux (.AppImage)</a></li>
          <li><a href="downloads/">Electron Linux (.AppImage)</a></li>
        </ul>
        <p>Build: ${CI_COMMIT_SHORT_SHA}</p>
      </body>
      </html>
      EOF
  artifacts:
    paths:
      - public
  only:
    - main
  dependencies:
    - build-tauri-linux
    - build-electron-linux
