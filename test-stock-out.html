<!DOCTYPE html>
<html>
<head>
    <title>Stock Out Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .record { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .date { color: #666; font-size: 14px; }
        .quantity { font-weight: bold; color: #FF3B30; }
    </style>
</head>
<body>
    <h1>Stock Out Records Test</h1>
    <button onclick="loadRecords()">Load Records</button>
    <div id="output"></div>

    <script>
        async function loadRecords() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch('http://localhost:5000/api/storekeeping/stock-movements', {
                    headers: {
                        'Authorization': 'Bearer YOUR_TOKEN_HERE' // Replace with actual token
                    }
                });
                
                const data = await response.json();
                console.log('API Response:', data);
                
                if (data.success && data.data) {
                    const stockOuts = data.data.filter(m => 
                        m.movement_type === 'STOCK_OUT' || m.movement_type === 'DISPATCH_OUT'
                    );
                    
                    output.innerHTML = `<p>Found ${stockOuts.length} stock out records</p>`;
                    
                    stockOuts.forEach(record => {
                        const date = new Date(record.created_at);
                        const formattedDate = date.toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        
                        const div = document.createElement('div');
                        div.className = 'record';
                        div.innerHTML = `
                            <div><strong>${record.item?.item_name || record.item_sku}</strong></div>
                            <div class="date">Date: ${formattedDate}</div>
                            <div class="date">Raw: ${record.created_at}</div>
                            <div class="quantity">Quantity: -${record.quantity}</div>
                            <div class="date">Type: ${record.movement_type}</div>
                        `;
                        output.appendChild(div);
                    });
                } else {
                    output.innerHTML = '<p>No data returned</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                output.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
